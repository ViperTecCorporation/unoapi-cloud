openapi: 3.0.3
info:
  title: ViperConnect API
  version: 2.5.2
  description: |
    API compatível com WhatsApp Cloud (formato de payload), utilizando Baileys como transporte.
    - Endpoints espelham em grande parte a estrutura do Cloud API (ex.: `v15.0/{phone}/messages`).
    - Suporta envios de texto, mídia (imagem/áudio/documento/vídeo), contatos e mensagens interativas (botões/listas).
servers:
  - url: /
security:
  - ApiToken: []

paths:
  /ping:
    get:
      summary: Healthcheck
      responses:
        '200':
          description: pong
          content:
            text/plain:
              schema:
                type: string

  /version:
    get:
      summary: Consultar versão instalada e última tag publicada
      description: A consulta ao GitHub é feita no servidor e armazenada em cache por 15 minutos.
      responses:
        '200':
          description: Estado de atualização do ViperConnect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionStatus'

  /admin/rabbitmq/queues:
    get:
      tags: [Administração]
      summary: Listar filas RabbitMQ da UnoAPI
      description: |
        Requer o token administrativo global (`UNOAPI_AUTH_TOKEN`). As credenciais são
        obtidas internamente de `AMQP_URL`; nenhuma credencial do RabbitMQ é recebida
        ou devolvida por esta rota.
      responses:
        '200':
          description: Filas cujo nome pertence ao namespace configurado da UnoAPI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queues:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        messages: { type: integer }
                        messages_ready: { type: integer }
                        messages_unacknowledged: { type: integer }
                        consumers: { type: integer }
                        state: { type: string }
        '403':
          description: Token administrativo global obrigatório.

  /admin/rabbitmq/queues/{queue}/messages:
    parameters:
      - name: queue
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Administração]
      summary: Inspecionar uma amostra de mensagens da fila
      description: |
        Lê até 50 mensagens e as recoloca na fila. A inspeção pode alterar a ordem
        relativa das mensagens e nunca remove itens.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - name: session
          in: query
          description: Filtra a amostra por telefone da sessão no routing key ou payload.
          schema: { type: string }
      responses:
        '200':
          description: Amostra com campos sensíveis mascarados.
        '403':
          description: Token administrativo global obrigatório ou fila fora do namespace permitido.
    delete:
      tags: [Administração]
      summary: Remover uma ou várias mensagens prontas
      description: |
        Remove as próximas 1 a 50 mensagens prontas ou todas quando `count` for `all`.
        Mensagens já entregues a consumidores (unacked) não são removidas. Exige confirmação
        literal do nome da fila.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count, confirm]
              properties:
                count:
                  oneOf:
                    - { type: integer, minimum: 1, maximum: 50 }
                    - { type: string, enum: [all] }
                confirm:
                  type: string
                  description: Nome exato da fila.
      responses:
        '200':
          description: Resultado da remoção.
        '400':
          description: Confirmação inválida.
        '403':
          description: Token administrativo global obrigatório ou fila fora do namespace permitido.

  /admin/redis/keys:
    get:
      tags: [Administração]
      summary: Listar chaves Redis da UnoAPI
      description: |
        Usa SCAN e limita o resultado a 1000 chaves. Somente os namespaces `unoapi-`
        e `unoapi:` são visíveis. Requer o token administrativo global.
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Chaves encontradas.
        '403':
          description: Token administrativo global obrigatório.

  /admin/redis/keys/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Administração]
      summary: Consultar tipo, TTL e conteúdo de uma chave
      description: Limita coleções grandes e mascara campos sensíveis.
      responses:
        '200':
          description: Conteúdo tipado da chave.
        '403':
          description: Token administrativo global obrigatório ou chave fora do namespace permitido.
    put:
      tags: [Administração]
      summary: Criar ou substituir uma chave
      description: |
        Aceita string, hash, list, set e zset. Exige confirmação literal da chave.
        Conteúdo mascarado não pode ser salvo, evitando substituir segredos por `[REDACTED]`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value, confirm]
              properties:
                type: { type: string, enum: [string, hash, list, set, zset] }
                value: {}
                ttlSeconds: { type: integer, description: Use -1 para não expirar. }
                confirm: { type: string, description: Nome exato da chave. }
      responses:
        '200':
          description: Chave salva.
        '400':
          description: Confirmação, tipo ou conteúdo inválido.
        '403':
          description: Token administrativo global obrigatório ou chave fora do namespace permitido.
    delete:
      tags: [Administração]
      summary: Excluir uma chave
      description: Exige confirmação literal do nome da chave.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string }
      responses:
        '200':
          description: Quantidade de chaves removidas.
        '400':
          description: Confirmação inválida.
        '403':
          description: Token administrativo global obrigatório ou chave fora do namespace permitido.

  /admin/redis/query:
    post:
      tags: [Administração]
      summary: Executar consulta Redis segura
      description: |
        Aceita apenas SCAN, TYPE, TTL, GET, HGETALL, LRANGE, SMEMBERS e ZRANGE.
        Comandos administrativos, escrita, scripts e chaves fora do namespace UnoAPI são bloqueados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [SCAN, TYPE, TTL, GET, HGETALL, LRANGE, SMEMBERS, ZRANGE]
                args:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Resultado da consulta.
        '400':
          description: Comando não permitido.
        '403':
          description: Token administrativo global obrigatório ou chave fora do namespace permitido.

  /sessions:
    get:
      summary: Listar sessões/configurações visíveis
      responses:
        '200':
          description: Lista de conexões/sessões
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsList'

  /sessions/{phone}:
    get:
      summary: UI de sessão (QR/Config)
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: HTML com QR/Config da sessão
          content:
            text/html:
              schema:
                type: string

  /v15.0/{phone}:
    get:
      summary: Status e configuração da sessão
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: Informações da sessão e templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneInfo'

  /v15.0/{phone}/phone_numbers:
    get:
      summary: Listar conexões/telefones gerenciados
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: Lista de configurações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsList'

  /v15.0/{phone}/message_templates:
    get:
      summary: Listar templates
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: Templates disponíveis
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /v15.0/{phone}/templates:
    post:
      summary: (Compat) Listar templates
      description: Compatível com o Cloud API; neste projeto retorna a lista local/forward.
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: Templates disponíveis
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /v15.0/{phone}/messages:
    post:
      summary: Enviar mensagem (WhatsApp Cloud shape)
      description: |
        - Em caso de falha de envio, a API responde 200 com corpo OK e o erro é enviado ao webhook de saída.
        - Para mensagens temporárias, informe `ttl` na raiz com o tempo de expiração em segundos.
        - Para publicar Status/Stories, use o modelo específico com `to: status@broadcast`.
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
            examples:
