x-base: &base
  build:
    dockerfile: develop.Dockerfile
  entrypoint: echo 'ok!'
  tty: true
  stdin_open: true
  volumes:
    - ./:/app
    - /app/node_modules
  working_dir: /app
  env_file:
    - /.env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &base-environment
    NODE_ENV: development
    CHOKIDAR_USEPOLLING: "1"
    CHOKIDAR_INTERVAL: "300"
    AMQP_URL: amqp://guest:guest@rabbitmq:5672?frameMax=8192
    BASE_URL: http://web:9876
    REDIS_URL: redis://redis:6379
    STORAGE_ENDPOINT: https://af1ce4a18c7a153046fbdc9ce50db632.r2.cloudflarestorage.com/
    VOIP_SERVICE_URL: http://host.docker.internal:3097
    VOIP_BRIDGE_URL: ws://host.docker.internal:3097/v1/bridge/zapo
    VOIP_SERVICE_TOKEN: ${VOIP_SERVICE_TOKEN:-change-me}
    # Capacidade compartilhada por linha Zapo: mínimo 2, máximo 32.
    VOIP_MAX_CONCURRENT_CALLS: "2"
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
  depends_on:
    redis:
      condition: service_healthy

services:
  web:
    <<: *base
    restart: on-failure
    entrypoint:
      - sh
      - -lc
      - yarn install --check-files && yarn cloud-dev
    environment:
      <<: *base-environment
      UNOAPI_PROCESS_ROLE: web
    ports:
      - 9876:9876
      - 9229:9229
    env_file:
    - /.env

  broker:
    <<: *base
    restart: on-failure
    entrypoint: [sh, -lc, "yarn install --check-files && yarn cloud-dev"]
    environment:
      <<: *base-environment
      UNOAPI_PROCESS_ROLE: broker
      UNOAPI_VIDEO_WORKER_MODE: dedicated

  video-worker:
    <<: *base
    restart: on-failure
    entrypoint: [sh, -lc, "yarn install --check-files && yarn cloud-dev"]
    environment:
      <<: *base-environment
      UNOAPI_PROCESS_ROLE: video
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M

  # O worker Baileys foi suprimido. O codigo legado permanece apenas como
  # referencia/rollback e nao deve ser reativado sem restaurar a politica,
  # os testes e o runbook operacional.
  worker-zapo:
    <<: *base
    restart: on-failure
    entrypoint: [sh, -lc, "yarn install --check-files && yarn cloud-dev"]
    environment:
      <<: *base-environment
      UNOAPI_PROCESS_ROLE: worker
      UNOAPI_WORKER_ENGINE: zapo
      ZAPO_NETWORK_IP_FAMILY: ${ZAPO_NETWORK_IP_FAMILY:-auto}
      ZAPO_CHAT_SOCKET_IP_FAMILY: ${ZAPO_CHAT_SOCKET_IP_FAMILY:-}
      ZAPO_MEDIA_UPLOAD_IP_FAMILY: ${ZAPO_MEDIA_UPLOAD_IP_FAMILY:-}
      ZAPO_MEDIA_DOWNLOAD_IP_FAMILY: ${ZAPO_MEDIA_DOWNLOAD_IP_FAMILY:-}
      ZAPO_LINK_PREVIEW_IP_FAMILY: ${ZAPO_LINK_PREVIEW_IP_FAMILY:-}

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: on-failure
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: on-failure
    volumes:
      - redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - 6379:6379

  voip:
    image: ghcr.io/viperteccorporation/viperconnect:latest
    restart: on-failure
    network_mode: host
    environment:
      PORT: "3097"
      UNOAPI_PROCESS_ROLE: "voip"
      VOIP_SERVICE_TOKEN: ${VOIP_SERVICE_TOKEN:-change-me}
      VOIP_BRIDGE_TOKEN: ${VOIP_SERVICE_TOKEN:-change-me}
      VOIP_MAX_CONCURRENT_CALLS: "2"
    volumes:
      - voip:/home/u/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3097/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  rabbitmq:
  redis:
  voip:
