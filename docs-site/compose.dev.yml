services:
  docs:
    build:
      context: ..
      dockerfile: docs-site/Dockerfile.dev
    image: viperconnect-docs:dev
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    ports:
      - "${DOCS_PORT:-8088}:8080"
    volumes:
      - ..:/workspace
      - docs_node_modules:/workspace/docs-site/node_modules

volumes:
  docs_node_modules:
